name: Pruebas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: |
          folder="$RUNNER_TEMP/credentials"
          mkdir "$folder"
          printf %s postgresql+asyncpg://postgres:postgres@localhost:5432/PRODUCTO > "$folder/app_database_url"
          printf %s test-health-token > "$folder/app_health_token"
          printf %s "{}" > "$folder/app_min_client_versions"
          printf %s 0FDyrOoVgPY9sMS6gmeGBYIwTWh_I11LIzZMzu4z4wY= > "$folder/app_page_token_key"
          echo "CREDENTIALS_DIRECTORY=$folder" >> "$GITHUB_ENV"
          # The migrations log in as the owner of the schema, as in production.
          cp -r "$folder" "$RUNNER_TEMP/owner"
          printf %s postgresql+asyncpg://PRODUCTO_owner:owner@localhost:5432/PRODUCTO > "$RUNNER_TEMP/owner/app_database_url"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: server/pyproject.toml
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyrefly check
      - run: uv run deptry .
      - run: |
          uv export --locked --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/req.txt"
          uv run pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/req.txt"
      # The roles, the database and the extensions install.py creates.
      - run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE ROLE PRODUCTO" \
            -c "CREATE ROLE PRODUCTO_owner LOGIN PASSWORD 'owner'" \
            -c "CREATE DATABASE PRODUCTO OWNER PRODUCTO_owner"
          psql postgresql://postgres:postgres@localhost:5432/PRODUCTO -c "CREATE EXTENSION postgis"
      - run: uv run alembic upgrade head
        env:
          CREDENTIALS_DIRECTORY: ${{ runner.temp }}/owner
      - run: uv run pytest
        env:
          PYTHONDEVMODE: "1"
          PYTHONWARNDEFAULTENCODING: "1"
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      # Qt loads libEGL, which the runner image does not have.
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: desktop/pyproject.toml
      - run: uv sync
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyrefly check
      - run: uv run deptry .
      - run: |
          uv export --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/req.txt"
          uv run pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/req.txt"
      - run: uv run pytest
        env:
          PYTHONDEVMODE: "1"
          PYTHONWARNDEFAULTENCODING: "1"
      - run: sudo apt-get install -y patchelf ccache
      - run: uv sync --group deploy
      - run: uv run pyside6-deploy -c pysidedeploy.spec --force

  flet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: flet/pyproject.toml
      - run: uv sync
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyrefly check
      - run: uv run deptry .
      - run: |
          uv export --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/req.txt"
          uv run pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/req.txt"
      - run: uv run pytest
        env:
          PYTHONDEVMODE: "1"
          PYTHONWARNDEFAULTENCODING: "1"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.5"
      - run: uv run flet build apk --yes

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
      - run: pnpm dlx sv@1.3.0 create web --template minimal --types ts --no-add-ons --install pnpm
      - run: pnpm exec svelte-kit sync
        working-directory: web
      - run: pnpm exec svelte-check --fail-on-warnings
        working-directory: web
      - run: pnpm build
        working-directory: web

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: flutter create app
      - run: flutter pub get
        working-directory: app
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: app
      - run: flutter analyze --fatal-infos
        working-directory: app
      - run: flutter test
        working-directory: app
      - run: flutter build apk --debug
        working-directory: app
